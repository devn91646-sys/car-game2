# car-game2

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DEV RACING PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;font-family:Arial,sans-serif;color:white;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:7px;pointer-events:none}
.stat{background:#08131cdd;border:1px solid #ffffff32;padding:9px 12px;border-radius:12px;box-shadow:0 4px 15px #0003;font-size:11px;letter-spacing:1px}
.stat strong{display:block;color:#50ffd0;font-size:21px;margin-top:3px}
.logo{position:fixed;top:15px;left:50%;transform:translateX(-50%);font-size:16px;font-weight:1000;letter-spacing:3px;text-shadow:0 0 15px #00ffbb}
#map{position:fixed;top:80px;right:12px;width:100px;height:130px;border:1px solid #ffffff70;border-radius:12px;background:#07130edb}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(130deg,#07131bdf,#092b27bc);padding:20px}
.card{width:min(420px,100%);text-align:center;padding:28px 22px;border-radius:24px;background:#091a26ed;border:1px solid #50ffd078;box-shadow:0 0 65px #00ffad18}
.card h1{font-size:36px;line-height:1.1;margin:10px 0;color:#50ffd0}
.card p{color:#c5d7df;line-height:1.7}
button{font:inherit;font-weight:bold;cursor:pointer;touch-action:none}
#start{width:100%;border:0;border-radius:13px;background:#50ffd0;color:#061710;padding:16px;margin-top:12px;font-size:18px}
#start:active,.pad:active{transform:scale(.94)}
.controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 17px;pointer-events:none}
.group{display:flex;gap:10px;pointer-events:auto;align-items:end}
.pad{width:63px;height:61px;border:1px solid #ffffff48;border-radius:17px;background:#07151ddd;color:white;font-size:24px;box-shadow:0 5px 16px #0005}
#boost{font-size:13px;color:#61e8ff}
.tip{position:fixed;bottom:91px;left:50%;transform:translateX(-50%);background:#07131bd9;border-radius:9px;padding:8px 11px;font-size:11px;white-space:nowrap;color:#d7e7ed}
@media(max-width:500px){.stat{padding:8px;font-size:9px}.stat strong{font-size:18px}.logo{top:65px;font-size:13px}.controls{bottom:16px}.pad{width:57px;height:57px}#map{width:82px;height:105px;top:105px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="logo">DEV RACING PRO</div>
<div class="hud">
 <div class="stat">SPEED<strong><span id="speed">0</span> <small>KM/H</small></strong></div>
 <div class="stat">SCORE<strong id="score">0</strong></div>
 <div class="stat">BEST<strong id="best">0</strong></div>
</div>
<canvas id="map" width="100" height="130"></canvas>

<div class="tip">← → STEER &nbsp; • &nbsp; ↑ ACCELERATE &nbsp; • &nbsp; SHIFT NITRO</div>

<div class="controls">
 <div class="group">
  <button class="pad" id="left">◀</button>
  <button class="pad" id="right">▶</button>
 </div>
 <div class="group">
  <button class="pad" id="brake">▼</button>
  <button class="pad" id="boost">⚡<br>NITRO</button>
 </div>
</div>

<div id="menu">
 <div class="card">
  <div style="font-size:45px">🏎️</div>
  <h1>DEV RACING<br>PRO</h1>
  <p>OPEN ROAD · FAST SUPERCAR</p>
  <p>अपनी तेज कार दौड़ाओ, ट्रैफिक को पीछे छोड़ो और अपना हाई स्कोर बनाओ!</p>
  <p>🎮 PC + Mobile Controls<br>🌲 Road Map · ⚡ Nitro · 🚘 Traffic</p>
  <button id="start">START RACE 🚀</button>
 </div>
</div>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const mc=document.getElementById("map");
const m=mc.getContext("2d");
let W,H,dpr,game=false,dead=false;
let pos=0,speed=0,score=0,travel=0,shake=0;
let cars=[],keys={},nitro=false,last=0,spawn=0;
let best=0;
try{best=Number(localStorage.getItem("devRacingProBest"))||0}catch(e){}
document.getElementById("best").textContent=best;

function resize(){
 W=innerWidth;H=innerHeight;
 dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=W*dpr;canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

function reset(){
 pos=0;speed=0;score=0;travel=0;shake=0;spawn=0;
 cars=[];
 for(let i=0;i<7;i++)addCar(.2+i*.13);
 game=true;dead=false;
 document.getElementById("menu").style.display="none";
}
document.getElementById("start").onclick=reset;

function addCar(z){
 let lanes=[-.68,-.34,0,.34,.68];
 cars.push({
  x:lanes[Math.floor(Math.random()*lanes.length)],
  z,color:["#ff4343","#ffd23f","#36b9ff","#e6e9ee","#b05cff","#ff8a38"][Math.floor(Math.random()*6)],
  passed:false
 });
}

function curve(z){
 return Math.sin(travel*.00055+z*2.7)*.25+
        Math.sin(travel*.00022+z*5)*.07;
}
function proj(z,lane=0){
 z=Math.max(0,Math.min(1.2,z));
 let t=z;
 let horizon=H*.36;
 let y=horizon+Math.pow(t,1.75)*(H-horizon);
 let half=W*(.035+.44*Math.pow(t,1.1));
 let center=W*.5+curve(t)*W*.60;
 return {x:center+lane*half,y,half,center,t};
}
function poly(points,color){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.moveTo(points[0][0],points[0][1]);
 for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);
 ctx.closePath();ctx.fill();
}

function background(){
 let sky=ctx.createLinearGradient(0,0,0,H*.6);
 sky.addColorStop(0,"#55a9ed");sky.addColorStop(1,"#e6f7ff");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // Sun
 ctx.fillStyle="#fff2b3";ctx.beginPath();
 ctx.arc(W*.8,H*.14,Math.min(W,H)*.055,0,7);ctx.fill();
 // distant mountains
 poly([[0,H*.43],[W*.13,H*.24],[W*.25,H*.4],[W*.43,H*.22],
 [W*.59,H*.39],[W*.79,H*.25],[W,H*.42],[W,H*.53],[0,H*.53]],"#78988a");
 // fields
 ctx.fillStyle="#318b43";ctx.fillRect(0,H*.38,W,H*.62);
 for(let i=0;i<12;i++){
  ctx.fillStyle=i%2?"#379849":"#2f8240";
  ctx.fillRect(i*W/12,H*.42,W/24,H*.58);
 }
}

function tree(x,y,s){
 ctx.fillStyle="#65472a";ctx.fillRect(x-s*.08,y-s*.1,s*.16,s*.48);
 ctx.fillStyle="#125a2d";
 ctx.beginPath();ctx.moveTo(x,y-s*1.4);
 ctx.lineTo(x-s*.55,y+s*.08);ctx.lineTo(x+s*.55,y+s*.08);ctx.fill();
 ctx.fillStyle="#20803a";
 ctx.beginPath();ctx.moveTo(x,y-s*1.05);
 ctx.lineTo(x-s*.42,y+s*.12);ctx.lineTo(x+s*.42,y+s*.12);ctx.fill();
}

function scenery(){
 for(let side of [-1,1]){
  for(let i=0;i<13;i++){
   let z=((i/13+travel*.00014)%1);
   let p=proj(z);
   let s=5+z*z*Math.min(W,H)*.10;
   tree(p.center+side*(p.half*1.18+W*.018),p.y,s);
  }
 }
}

function road(){
 for(let i=0;i<75;i++){
  let z1=i/75,z2=(i+1)/75;
  let a=proj(z1),b=proj(z2);
  let alt=(Math.floor(travel/7+i/2)%2===0);
  // shoulders
  poly([[a.center-a.half*1.13,a.y],[a.center+a.half*1.13,a.y],
  [b.center+b.half*1.13,b.y],[b.center-b.half*1.13,b.y]],alt?"#d1d2c8":"#a7b1a5");
  // asphalt
  poly([[a.center-a.half,a.y],[a.center+a.half,a.y],
  [b.center+b.half,b.y],[b.center-b.half,b.y]],alt?"#30383e":"#343b41");
  // road edges
  let e1=Math.max(1,a.half*.013),e2=Math.max(1,b.half*.013);
  poly([[a.center-a.half,a.y],[a.center-a.half+e1,a.y],
  [b.center-b.half+e2,b.y],[b.center-b.half,b.y]],"#f7f4dc");
  poly([[a.center+a.half-e1,a.y],[a.center+a.half,a.y],
  [b.center+b.half,b.y],[b.center+b.half-e2,b.y]],"#f7f4dc");
  // lane markings
  if(Math.floor(travel/10+i/3)%2===0){
   for(let lane of [-1/3,1/3]){
    let w1=Math.max(1,a.half*.012),w2=Math.max(1,b.half*.012);
    poly([[a.center+lane*a.half-w1,a.y],[a.center+lane*a.half+w1,a.y],
    [b.center+lane*b.half+w2,b.y],[b.center+lane*b.half-w2,b.y]],"#fff4cf");
   }
  }
 }
}

function car(x,y,w,h,color,hero=false){
 // shadow
 ctx.fillStyle="#0006";ctx.beginPath();
 ctx.ellipse(x,y+h*.79,w*.58,h*.12,0,0,Math.PI*2);ctx.fill();
 // wheels
 ctx.fillStyle="#111519";
 for(let side of [-1,1]){
  ctx.fillRect(x+side*w*.42-w*.08,y+h*.24,w*.16,h*.25);
  ctx.fillRect(x+side*w*.42-w*.08,y+h*.63,w*.16,h*.22);
 }
 // chassis
 poly([[x-w*.36,y+h*.83],[x-w*.46,y+h*.28],
 [x-w*.29,y+h*.04],[x+w*.29,y+h*.04],
 [x+w*.46,y+h*.28],[x+w*.36,y+h*.83]],color);
 // windshield
 poly([[x-w*.25,y+h*.27],[x-w*.17,y+h*.10],
 [x+w*.17,y+h*.10],[x+w*.25,y+h*.27]],"#183445");
 poly([[x-w*.27,y+h*.32],[x+w*.27,y+h*.32],
 [x+w*.30,y+h*.48],[x-w*.30,y+h*.48]],"#3b6174");
 // headlights
 ctx.fillStyle="#fff4b2";
 ctx.fillRect(x-w*.32,y+h*.69,w*.15,h*.06);
 ctx.fillRect(x+w*.17,y+h*.69,w*.15,h*.06);
 // tail lights
 ctx.fillStyle="#ff293e";
 ctx.fillRect(x-w*.34,y+h*.82,w*.13,h*.06);
 ctx.fillRect(x+w*.21,y+h*.82,w*.13,h*.06);
 if(hero){
  ctx.fillStyle="#cafff1";
  ctx.fillRect(x-w*.08,y+h*.57,w*.16,h*.06);
 }
}

function drawCars(){
 cars.sort((a,b)=>a.z-b.z);
 for(let c of cars){
  if(c.z<0||c.z>1.2)continue;
  let p=proj(c.z,c.x-pos*.50);
  let w=9+p.t*p.t*Math.min(W,H)*.075;
  let h=w*1.7;
  car(p.x,p.y-h*.83,w,h,c.color);
 }
}

function player(){
 let x=W*.5+pos*W*.32;
 let w=Math.max(38,Math.min(W*.10,69)),h=w*1.7;
 if(nitro&&speed>20&&game){
  for(let side of [-1,1]){
   poly([[x+side*w*.21,H-h*.01],[x+side*w*.15,H+h*.18+Math.random()*8],
   [x+side*w*.04,H-h*.01]],"#42dcff");
  }
 }
 car(x,H-h*.85,w,h,"#0edaa2",true);
}

function drawMap(){
 m.clearRect(0,0,100,130);
 m.fillStyle="#17482b";m.fillRect(0,0,100,130);
 m.strokeStyle="#b7c3bc";m.lineWidth=29;
 m.beginPath();m.moveTo(50,130);m.lineTo(50,0);m.stroke();
 m.strokeStyle="#fff";m.lineWidth=1;m.setLineDash([5,5]);
 m.beginPath();m.moveTo(50,130);m.lineTo(50,0);m.stroke();
 m.setLineDash([]);
 for(let c of cars){
  if(c.z<0||c.z>1)continue;
  m.fillStyle=c.color;m.beginPath();
  m.arc(50+c.x*22,120-c.z*108,3,0,7);m.fill();
 }
 m.fillStyle="#50ffd0";m.beginPath();
 m.arc(50+pos*20,117,4,0,7);m.fill();
 m.fillStyle="white";m.font="bold 9px Arial";
 m.fillText("MINI MAP",32,10);
}

function endGame(){
 game=false;dead=true;
 document.getElementById("menu").style.display="grid";
 document.querySelector(".card h1").innerHTML="RACE OVER";
 document.querySelector(".card p").innerHTML=
 "🏆 SCORE: "+score+"<br>BEST SCORE: "+best;
 document.querySelector(".card p:nth-of-type(2)").textContent="फिर से रेस के लिए तैयार?";
 document.getElementById("start").textContent="RACE AGAIN 🔄";
}

function update(dt){
 let left=keys.ArrowLeft||keys.a||keys.A;
 let right=keys.ArrowRight||keys.d||keys.D;
 let up=keys.ArrowUp||keys.w||keys.W;
 let down=keys.ArrowDown||keys.s||keys.S;
 let turbo=keys.Shift||nitro;
 if(up)speed+=110*dt;
 else speed+=28*dt;
 if(down)speed-=180*dt;
 if(turbo&&speed>0)speed+=100*dt;
 speed=Math.max(0,Math.min(turbo?270:205,speed));
 pos+=(Number(right)-Number(left))*dt*(1.2+speed/105);
 pos=Math.max(-1.10,Math.min(1.10,pos));
 if(Math.abs(pos)>.96)speed=Math.max(30,speed-95*dt);
 travel+=speed*dt;
 score=Math.floor(travel/3);
 spawn+=dt;
 if(spawn>.75&&cars.length<10){addCar(1.02+Math.random()*.2);spawn=0}
 for(let c of cars){
  // Traffic moves more slowly than the player's car.
  c.z-=dt*(.12+speed/1400);
  if(!c.passed&&c.z<.17&&c.z>.015){
   if(Math.abs(c.x-pos*.50)<.28){
    speed=Math.max(0,speed*.48);
    c.passed=true;
    c.z=-.2;
   }else{
    score+=100;c.passed=true;
   }
  }
 }
 cars=cars.filter(c=>c.z>-.12);
 document.getElementById("speed").textContent=Math.round(speed);
 document.getElementById("score").textContent=score;
 if(score>best){
  best=score;
  document.getElementById("best").textContent=best;
  try{localStorage.setItem("devRacingProBest",best)}catch(e){}
 }
}

function loop(now){
 let dt=Math.min((now-last)/1000||0,.035);last=now;
 if(game)update(dt);
 background();scenery();road();drawCars();player();drawMap();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener("keydown",e=>{
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 keys[e.key]=true;
 if(e.key==="Enter"&&!game)reset();
});
addEventListener("keyup",e=>keys[e.key]=false);

function bind(id,key){
 let el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;
  try{el.setPointerCapture(e.pointerId)}catch(_){}
 });
 for(let ev of ["pointerup","pointercancel","lostpointercapture"])
  el.addEventListener(ev,()=>keys[key]=false);
}
bind("left","ArrowLeft");
bind("right","ArrowRight");
bind("brake","ArrowDown");
bind("boost","Shift");
document.addEventListener("visibilitychange",()=>{if(document.hidden)keys={}});
</script>
</body>
</html>
